# gitleaks configuration.
#
# Start from gitleaks' full default ruleset, then add one narrow exception:
# this repo's README quotes a deliberately fake AWS key, because the
# walkthrough shows gitleaks blocking exactly that. Without this allowlist
# the doc describing the check would trip the check.
#
# This is a normal thing to need in real repos too — test fixtures and
# example config routinely contain fake-but-realistic credentials.

[extend]
useDefault = true

[allowlist]
description = "The walkthrough quotes a fake AWS key on purpose"
paths = [
  '''README\.md''',
]
