# gitleaks configuration.
#
# Start from gitleaks' full default ruleset, then add one narrow exception:
# this repo's own documentation quotes a deliberately fake AWS key, because
# the demo walks through gitleaks blocking exactly that. Without this
# allowlist the docs describing the check would trip the check.
#
# This is a normal thing to need in real repos too — test fixtures and
# example config routinely contain fake-but-realistic credentials.

[extend]
useDefault = true

[allowlist]
description = "Demo docs quote a fake AWS key on purpose"
paths = [
  '''DEMO_SCRIPT\.md''',
]
